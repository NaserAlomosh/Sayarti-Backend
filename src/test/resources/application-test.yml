spring:
  config:
    activate:
      on-profile: test
  datasource:
    url: jdbc:h2:mem:sayarti;MODE=MSSQLServer;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create-drop
  flyway:
    enabled: false
sayarti:
  cors:
    allowed-origins: http://localhost
  jwt:
    access-secret: test-access-secret-that-is-at-least-thirty-two-bytes-long
    refresh-secret: unused-test-refresh-secret-that-is-at-least-thirty-two-bytes
    access-expiration: 900000
    refresh-expiration: 2592000000
  google:
    client-id: test-google-client-id.apps.googleusercontent.com
