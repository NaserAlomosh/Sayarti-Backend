spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: sayarti-backend
  messages:
    basename: messages
    encoding: UTF-8
    fallback-to-system-locale: false
  profiles:
    default: dev
  datasource:
    url: jdbc:sqlserver://${DB_HOST:localhost}:${DB_PORT:1433};databaseName=${DB_NAME:sayarti};encrypt=true;trustServerCertificate=${DB_TRUST_SERVER_CERTIFICATE:true}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.SQLServerDialect
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
  mvc:
    problemdetails:
      enabled: false
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:25}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          starttls:
            enable: ${SMTP_TLS:false}
            required: ${SMTP_STARTTLS_REQUIRED:false}
          ssl:
            enable: ${SMTP_SSL:false}
          connectiontimeout: ${SMTP_CONNECTION_TIMEOUT:10000}
          timeout: ${SMTP_TIMEOUT:60000}
          writetimeout: ${SMTP_WRITE_TIMEOUT:60000}

server:
  error:
    include-message: never
    include-stacktrace: never

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

sayarti:
  api-base-path: /api/v1
  email:
    from: ${SMTP_FROM:no-reply@example.com}
  cors:
    allowed-origins: ${ALLOWED_ORIGINS:http://localhost:3000,http://localhost:8080}
  jwt:
    access-secret: ${JWT_ACCESS_SECRET:}
    refresh-secret: ${JWT_REFRESH_SECRET:}
    access-expiration: ${JWT_ACCESS_EXPIRATION:900000}
    refresh-expiration: ${JWT_REFRESH_EXPIRATION:2592000000}
  google:
    client-id: ${GOOGLE_CLIENT_ID:}
  email-otp:
    expiration-seconds: ${EMAIL_OTP_EXPIRATION_SECONDS:300}
    max-attempts: ${EMAIL_OTP_MAX_ATTEMPTS:5}
    resend-cooldown-seconds: ${EMAIL_OTP_RESEND_COOLDOWN_SECONDS:60}
  firebase:
    service-account-path: ${FIREBASE_SERVICE_ACCOUNT_PATH:}
  reminder-scheduler:
    fixed-delay-ms: ${REMINDER_SCHEDULER_INTERVAL_MS:60000}
    batch-size: ${REMINDER_SCHEDULER_BATCH_SIZE:100}
